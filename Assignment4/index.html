<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="icon" href="data:,">
    <title>Online Movie Ticket Booking System</title>
</head>
<body>
    <h1>Online Movie Ticket Booking System</h1>
    <script>
        console.log("Checking Seat Availability...");

        let booking = new Promise(function(resolve, reject) {
            setTimeout(function() {
                let seatsAvailable = true;
                if (seatsAvailable) {
                    resolve("Seats are Available");
                } else {
                    reject("No Seats Available");
                }
            }, 2000);
        });

        booking
            .then(function(message) {
                console.log(message);
                return "Payment Processed Successfully";
            })

            .then(function(message) {
                console.log(message);
                return "Booking Confirmed";
            })

            .then(function(message) {
                console.log(message);
                return "Ticket Generated Successfully";
            })

            .then(function(message) {
                console.log(message);
            })

            .catch(function(error) {
                console.log("Error:", error);
            });

    </script>

</body>
</html>
